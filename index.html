<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Machine</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        #display {
            font-size: 4rem;
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #000;
            min-height: 3rem;
        }

        .controls {
            margin: 20px 0;
        }

        .controls > * {
            margin: 0 10px;
        }

        #passage-input {
            width: 80%;
            margin: 10px 0;
            height: 20px;
            font-size: 0.8rem;
            overflow-y: scroll;
        }

        .bordered-text {
            text-shadow: 
                -1px -1px 0 #000,  
                1px -1px 0 #000, 
                -1px 1px 0 #000, 
                1px 1px 0 #000;
        }

        .clickable-word {
            cursor: pointer;
        }

        .highlighted-word {
            background-color: yellow;
        }

        #clickable-text {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #000;
            min-height: 3rem;
            text-align: left;
            max-height: 75px; /* Reduced height to half */
            overflow-y: scroll;
        }
    </style>
</head>
<body>

    <h1>Word Machine</h1>

    <textarea id="passage-input" rows="1" placeholder="Paste your passage here..."></textarea>
    <br>

    <div id="clickable-text"></div>

    <div class="controls">
        <button onclick="start()">Start</button>
        <button id="pause-resume" onclick="togglePauseResume()">Pause</button>
        <button onclick="restart()">Restart</button>
        <button onclick="reset()">Reset</button>
        <br><br>
        <label for="wpm">Words Per Minute:</label>
        <input type="number" id="wpm" value="120" min="10" max="1000">
        <label for="words-at-a-time">Words at a Time:</label>
        <input type="number" id="words-at-a-time" value="1" min="1" max="10">
    </div>

    <div id="display"></div>

    <script>
        let words = [];
        let currentIndex = 0;
        let intervalId;
        let isPaused = false;
        const colors = ["red", "orange", "yellow", "green", "blue", "indigo", "violet"];
        const darkColors = ["red", "blue", "indigo", "violet", "green"];

        function start() {
            const passage = document.getElementById('passage-input').value.trim();
            if (passage === "") return alert("Please enter a passage.");

            words = passage.split(/\s+/);
            currentIndex = 0;
            isPaused = false;
            displayClickableText();
            showWords();
        }

        function togglePauseResume() {
            if (isPaused) {
                resume();
            } else {
                pause();
            }
        }

        function pause() {
            clearInterval(intervalId);
            isPaused = true;
            document.getElementById('pause-resume').innerText = "Resume";
            highlightCurrentWord();
        }

        function resume() {
            if (isPaused) {
                isPaused = false;
                removeHighlight();
                showWords();
                document.getElementById('pause-resume').innerText = "Pause";
            }
        }

        function restart() {
            clearInterval(intervalId);
            currentIndex = 0;
            isPaused = false;
            document.getElementById('display').innerText = "";
            removeHighlight();
            showWords();
            document.getElementById('pause-resume').innerText = "Pause";
        }

        function reset() {
            clearInterval(intervalId);
            currentIndex = 0;
            isPaused = false;
            document.getElementById('display').innerText = "";
            document.getElementById('clickable-text').innerHTML = "";
            document.getElementById('passage-input').value = "";
            document.getElementById('pause-resume').innerText = "Pause";
        }

        function showWords() {
            const wpm = parseInt(document.getElementById('wpm').value);
            const wordsAtATime = parseInt(document.getElementById('words-at-a-time').value);
            const interval = (60000 / wpm) * wordsAtATime;

            clearInterval(intervalId);

            intervalId = setInterval(() => {
                if (currentIndex >= words.length) {
                    clearInterval(intervalId);
                    return;
                }

                let wordDisplay = "";
                for (let i = 0; i < wordsAtATime; i++) {
                    if (currentIndex + i >= words.length) break;

                    const color = colors[(currentIndex + i) % colors.length];
                    wordDisplay += `<span class="bordered-text" style="color:${color}">${words[currentIndex + i]}</span> `;
                }

                document.getElementById('display').innerHTML = wordDisplay.trim();
                currentIndex += wordsAtATime;
            }, interval);
        }

        function displayClickableText() {
            const clickableTextDiv = document.getElementById('clickable-text');
            clickableTextDiv.innerHTML = "";

            words.forEach((word, index) => {
                const span = document.createElement('span');
                span.textContent = word + " ";
                span.classList.add('clickable-word');
                span.onclick = () => {
                    currentIndex = index;
                    showWords();
                };
                clickableTextDiv.appendChild(span);
            });
        }

        function highlightCurrentWord() {
            const clickableTextDiv = document.getElementById('clickable-text');
            const spans = clickableTextDiv.getElementsByTagName('span');

            for (let i = 0; i < spans.length; i++) {
                spans[i].classList.remove('highlighted-word');
                spans[i].style.backgroundColor = "";
                spans[i].style.color = "";
                spans[i].style.textShadow = "";
            }

            if (currentIndex - 1 < spans.length && currentIndex - 1 >= 0) {
                const color = colors[(currentIndex - 1) % colors.length];
                spans[currentIndex - 1].style.backgroundColor = color;
                spans[currentIndex - 1].style.color = darkColors.includes(color) ? "white" : "black";
                spans[currentIndex - 1].style.textShadow = darkColors.includes(color) ? 
                    "-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000" : "";
                spans[currentIndex - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function removeHighlight() {
            const clickableTextDiv = document.getElementById('clickable-text');
            const spans = clickableTextDiv.getElementsByTagName('span');

            for (let i = 0; i < spans.length; i++) {
                spans[i].classList.remove('highlighted-word');
                spans[i].style.backgroundColor = "";
                spans[i].style.color = "";
                spans[i].style.textShadow = "";
            }
        }
    </script>

</body>
</html>
